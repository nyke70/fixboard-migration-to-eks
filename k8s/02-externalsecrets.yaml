apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: db-credentials
    template:
      data:
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@postgres-service:{{ .port }}/{{ .dbname }}"
  dataFrom:
    - extract:
        key: fixboard/db-credentials
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: backend-secrets
  dataFrom:
    - extract:
        key: fixboard/backend-secrets